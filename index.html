<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Food Tracker with Daily History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Main Form Card -->
    <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <h1 class="text-xl font-bold text-center text-gray-800">วิเคราะห์อาหารด้วย AI</h1>
      
      <!-- API Key Input -->
      <div>
        <label class="block text-xs font-medium text-gray-700">Gemini API Key</label>
        <input type="password" id="apiKey" class="mt-1 w-full border rounded-md p-2 text-sm" placeholder="ใส่ API Key ของคุณ">
      </div>

      <!-- Image Input -->
      <div>
        <label class="block text-xs font-medium text-gray-700">ถ่ายรูปหรือเลือกภาพอาหาร</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="mt-1 w-full text-sm">
      </div>

      <button onclick="analyzeFood()" id="btnSubmit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-semibold text-sm">
        วิเคราะห์รูปภาพ
      </button>

      <!-- Results Form (Editable) -->
      <div id="resultSection" class="hidden border-t pt-4 space-y-3">
        <h2 class="font-bold text-md text-gray-700">ผลการวิเคราะห์ (แก้ไขได้ก่อนบันทึก)</h2>
        
        <div>
          <label class="text-xs text-gray-500">ชื่ออาหาร</label>
          <input type="text" id="foodName" class="w-full border rounded p-2 text-sm font-semibold">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-gray-500">น้ำหนักประมาณ (กรัม)</label>
            <input type="number" id="weight" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">แคลอรีทั้งหมด (kcal)</label>
            <input type="number" id="calories" class="w-full border rounded p-2 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-xs text-gray-500">โปรตีน (g)</label>
            <input type="number" id="protein" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">คาร์โบไฮเดรต (g)</label>
            <input type="number" id="carbs" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">ไขมัน (g)</label>
            <input type="number" id="fat" class="w-full border rounded p-2 text-sm">
          </div>
        </div>

        <button onclick="saveMeal()" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 font-semibold text-sm">
          บันทึกรายการนี้ลงในประวัติประจำวัน
        </button>
      </div>
    </div>

    <!-- Daily Summary Card -->
    <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-lg text-gray-800">สรุปโภชนาการวันนี้</h2>
        <span id="currentDate" class="text-xs text-gray-500 font-medium"></span>
      </div>

      <!-- Stats Grid -->
      <div class="bg-blue-50 rounded-lg p-4 text-center">
        <p class="text-xs text-blue-600 font-semibold uppercase">แคลอรีสะสมรวม</p>
        <p class="text-3xl font-extrabold text-blue-700"><span id="totalCalories">0</span> <span class="text-sm font-normal">kcal</span></p>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="bg-gray-50 p-2 rounded border">
          <p class="text-gray-500">โปรตีนรวม</p>
          <p class="font-bold text-gray-800"><span id="totalProtein">0</span> g</p>
        </div>
        <div class="bg-gray-50 p-2 rounded border">
          <p class="text-gray-500">คาร์บรวม</p>
          <p class="font-bold text-gray-800"><span id="totalCarbs">0</span> g</p>
        </div>
        <div class="bg-gray-50 p-2 rounded border">
          <p class="text-gray-500">ไขมันรวม</p>
          <p class="font-bold text-gray-800"><span id="totalFat">0</span> g</p>
        </div>
      </div>

      <!-- Meal History List -->
      <div class="space-y-2">
        <h3 class="font-semibold text-sm text-gray-700">รายการอาหารวันนี้</h3>
        <div id="historyList" class="space-y-2 max-h-60 overflow-y-auto">
          <!-- Meal items will be injected here -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // โหลด API Key และประวัติอาหารเมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('currentDate').innerText = today;
      
      renderHistory();
    });

    async function analyzeFood() {
      const apiKey = document.getElementById('apiKey').value;
      const fileInput = document.getElementById('imageInput');
      const btn = document.getElementById('btnSubmit');

      if (!apiKey) return alert('กรุณาใส่ Gemini API Key');
      if (!fileInput.files[0]) return alert('กรุณาถ่ายรูปหรือเลือกไฟล์ภาพ');

      // บันทึก API Key ไว้ใช้ครั้งต่อไป
      localStorage.setItem('gemini_api_key', apiKey);

      btn.innerText = 'กำลังวิเคราะห์...';
      btn.disabled = true;

      try {
        const file = fileInput.files[0];
        const base64Image = await convertToBase64(file);
        const pureBase64 = base64Image.split(',')[1];

        const prompt = `วิเคราะห์ภาพอาหารนี้แล้วตอบกลับเป็น JSON ภาษาไทยเท่านั้น ตามโครงสร้างดังนี้:
        {
          "foodName": "ชื่ออาหาร",
          "weight": น้ำหนักเป็นกรัม (ตัวเลข),
          "calories": แคลอรีรวม (ตัวเลข),
          "protein": โปรตีนเป็นกรัม (ตัวเลข),
          "carbs": คาร์โบไฮเดรตเป็นกรัม (ตัวเลข),
          "fat": ไขมันเป็นกรัม (ตัวเลข)
        }`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: file.type, data: pureBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const data = await response.json();
        const resultText = data.candidates[0].content.parts[0].text;
        const foodData = JSON.parse(resultText);

        document.getElementById('foodName').value = foodData.foodName || '';
        document.getElementById('weight').value = foodData.weight || 0;
        document.getElementById('calories').value = foodData.calories || 0;
        document.getElementById('protein').value = foodData.protein || 0;
        document.getElementById('carbs').value = foodData.carbs || 0;
        document.getElementById('fat').value = foodData.fat || 0;

        document.getElementById('resultSection').classList.remove('hidden');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการวิเคราะห์: ' + err.message);
      } finally {
        btn.innerText = 'วิเคราะห์รูปภาพ';
        btn.disabled = false;
      }
    }

    function saveMeal() {
      const meal = {
        id: Date.now(),
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
        foodName: document.getElementById('foodName').value || 'ไม่ระบุชื่อ',
        weight: Number(document.getElementById('weight').value) || 0,
        calories: Number(document.getElementById('calories').value) || 0,
        protein: Number(document.getElementById('protein').value) || 0,
        carbs: Number(document.getElementById('carbs').value) || 0,
        fat: Number(document.getElementById('fat').value) || 0
      };

      const history = JSON.parse(localStorage.getItem('food_history') || '[]');
      history.push(meal);
      localStorage.setItem('food_history', JSON.stringify(history));

      // Reset Form & Hide Result Section
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('imageInput').value = '';

      renderHistory();
      alert('บันทึกเรียบร้อยแล้ว!');
    }

    function deleteMeal(id) {
      let history = JSON.parse(localStorage.getItem('food_history') || '[]');
      history = history.filter(item => item.id !== id);
      localStorage.setItem('food_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const today = new Date().toISOString().split('T')[0];
      const history = JSON.parse(localStorage.getItem('food_history') || '[]');
      const todayMeals = history.filter(item => item.date === today);

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      let totalCal = 0, totalP = 0, totalC = 0, totalF = 0;

      if (todayMeals.length === 0) {
        historyList.innerHTML = '<p class="text-xs text-center text-gray-400 py-4">ยังไม่มีรายการอาหารวันนี้</p>';
      } else {
        todayMeals.forEach(meal => {
          totalCal += meal.calories;
          totalP += meal.protein;
          totalC += meal.carbs;
          totalF += meal.fat;

          const card = document.createElement('div');
          card.className = 'flex justify-between items-center bg-gray-50 p-2.5 rounded border text-xs';
          card.innerHTML = `
            <div>
              <p class="font-bold text-gray-800">${meal.foodName} <span class="font-normal text-gray-400">(${meal.weight}g)</span></p>
              <p class="text-gray-500">${meal.time} • P:${meal.protein}g C:${meal.carbs}g F:${meal.fat}g</p>
            </div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-blue-600">${meal.calories} kcal</span>
              <button onclick="deleteMeal(${meal.id})" class="text-red-500 hover:text-red-700 font-bold px-1">✕</button>
            </div>
          `;
          historyList.appendChild(card);
        });
      }

      // Update Summary Cards
      document.getElementById('totalCalories').innerText = totalCal;
      document.getElementById('totalProtein').innerText = totalP;
      document.getElementById('totalCarbs').innerText = totalC;
      document.getElementById('totalFat').innerText = totalF;
    }

    function convertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
